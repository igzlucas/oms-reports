<div class="login-container">
  <div class="login-box">
    <div *ngIf="formMode === 'login'">
      <h2 class="text-2xl font-bold text-center">Bienvenido a Bordo</h2>
      <p class="text-center text-gray-500 mb-6">Inicia sesión para gestionar tus reportes</p>
      <form (ngSubmit)="loginWithEmail()">
        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
          <input type="email" id="email" [(ngModel)]="email" name="email" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required>
        </div>
        <div class="mb-4">
          <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
          <input type="password" id="password" [(ngModel)]="password" name="password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required>
        </div>
        <div class="flex items-center justify-between mb-6">
          <div class="flex items-center">
            <input id="remember-me" [(ngModel)]="rememberMe" name="remember-me" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
            <label for="remember-me" class="ml-2 block text-sm text-gray-900">Recordar</label>
          </div>
          <div class="text-sm">
            <a href="javascript:void(0)" (click)="showForgotPassword()" class="font-medium text-blue-600 hover:text-blue-500">¿Olvidaste tu contraseña?</a>
          </div>
        </div>
        <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">Iniciar Sesión</button>
      </form>
    </div>
    <div *ngIf="formMode === 'forgotPassword'">
      <h2 class="text-2xl font-bold text-center">Restablecer Contraseña</h2>
      <p class="text-center text-gray-500 mb-6">Ingresa tu correo para enviarte las instrucciones</p>
      <form (ngSubmit)="resetPassword()">
        <div class="mb-4">
          <label for="reset-email" class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
          <input type="email" id="reset-email" [(ngModel)]="email" name="reset-email" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required>
        </div>
        <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">Enviar Instrucciones</button>
      </form>
      <div class="text-center mt-4">
        <a href="javascript:void(0)" (click)="showLoginForm()" class="font-medium text-blue-600 hover:text-blue-500">Volver a Iniciar Sesión</a>
      </div>
    </div>
    <p class="mt-8 text-center text-xs text-gray-400">
      &copy; {{ fecha }} GLI. Todos los derechos reservados.
    </p>
  </div>
</div>
