<div class="container mx-auto p-4 z-20">
    <h1 class="text-2xl font-bold mb-4">Configuración</h1>

    <!-- Tab Navigation -->
    <div class="border-b border-gray-200">
        <nav class="-mb-px flex space-x-8">
            <button (click)="switchTab('profile')" 
                    [ngClass]="{'border-blue-500 text-blue-600': activeTab === 'profile', 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300': activeTab !== 'profile'}"
                    class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
                Perfil de Usuario
            </button>
            <button (click)="switchTab('empresa')" 
                    [ngClass]="{'border-blue-500 text-blue-600': activeTab === 'empresa', 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300': activeTab !== 'empresa'}"
                    class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
                Empresa
            </button>
        </nav>
    </div>

    <!-- Tab Content -->
    <div class="mt-6">
        <!-- Profile Tab -->
        <div *ngIf="activeTab === 'profile' && user">
            <div class="bg-white p-6 rounded-lg shadow space-y-6">
                <!-- User Info -->
                <div>
                    <h3 class="text-lg font-semibold">Información del Perfil</h3>
                    <div class="mt-4 space-y-4">
                        <div>
                            <label for="displayName" class="block text-sm font-medium text-gray-700">Nombre de Usuario</label>
                            <input type="text" id="displayName" [(ngModel)]="displayName" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                        </div>
                    </div>
                </div>

                <!-- Change Password -->
                <div>
                    <h3 class="text-lg font-semibold">Cambiar Contraseña</h3>
                    <div class="mt-4 space-y-4">
                        <div>
                            <label for="currentPassword" class="block text-sm font-medium text-gray-700">Contraseña Actual</label>
                            <input type="password" id="currentPassword" [(ngModel)]="passwordData.currentPassword" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                        </div>
                        <div>
                            <label for="newPassword" class="block text-sm font-medium text-gray-700">Nueva Contraseña</label>
                            <input type="password" id="newPassword" [(ngModel)]="passwordData.newPassword" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                        </div>
                        <div>
                            <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirmar Nueva Contraseña</label>
                            <input type="password" id="confirmPassword" [(ngModel)]="passwordData.confirmPassword" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empresa Tab -->
        <div *ngIf="activeTab === 'empresa' && empresa">
            <div class="bg-white p-6 rounded-lg shadow space-y-8">
                
                <!-- Basic Info & Logo -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="md:col-span-2 space-y-4">
                        <h3 class="text-lg font-semibold">Información de la Empresa</h3>
                        <div>
                            <label for="nombreEmpresa" class="block text-sm font-medium text-gray-700">Nombre</label>
                            <input type="text" id="nombreEmpresa" name="nombreEmpresa" [(ngModel)]="empresa.nombre" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                        </div>
                        <div>
                            <label for="direccionEmpresa" class="block text-sm font-medium text-gray-700">Dirección</label>
                            <input type="text" id="direccionEmpresa" name="direccionEmpresa" [(ngModel)]="empresa.direccion" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                        </div>
                        <div>
                            <label for="correoEmpresa" class="block text-sm font-medium text-gray-700">Correo</label>
                            <input type="email" id="correoEmpresa" name="correoEmpresa" [(ngModel)]="empresa.correo" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                        </div>
                    </div>
                    <div class="flex flex-col items-center">
                        <label class="block text-sm font-medium text-gray-700 self-start">Logotipo</label>
                        <img [src]="empresa.logoUrl || 'assets/images/default-logo.png'" alt="Logo" class="w-32 h-32 rounded-md border border-gray-300 mt-2 object-cover">
                        <input type="file" accept="image/*" (change)="onFileSelected($event)" class="mt-4 text-sm">
                    </div>
                </div>

                <!-- Telefonos -->
                <div>
                    <h3 class="text-lg font-semibold mb-2">Teléfonos</h3>
                    <div class="flex items-center space-x-2 mb-2">
                        <input type="text" [(ngModel)]="newTelefono" placeholder="Añadir teléfono" class="flex-grow px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                        <button (click)="addTelefono()" class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600">Añadir</button>
                    </div>
                    <ul class="list-disc list-inside space-y-1">
                        <li *ngFor="let tel of empresa.telefonos; let i = index" class="flex items-center justify-between">
                            <span>{{ tel }}</span>
                            <button (click)="removeTelefono(i)" class="text-red-500 hover:text-red-700 text-sm">Eliminar</button>
                        </li>
                    </ul>
                </div>

                <!-- Terminos y Condiciones -->
                <div>
                    <h3 class="text-lg font-semibold mb-2">Términos y Condiciones</h3>
                    <div>
                        <label for="terminosCondiciones" class="block text-sm font-medium text-gray-700">Contenido de los términos y condiciones que se mostrarán en los reportes.</label>
                        <textarea id="terminosCondiciones" name="terminosCondiciones" [(ngModel)]="empresa.terminosCondiciones" rows="6" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm"></textarea>
                    </div>
                </div>

                <!-- Cuentas Bancarias -->
                <div>
                    <h3 class="text-lg font-semibold mb-2">Cuentas Bancarias</h3>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Banco</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Número de Cuenta</th>
                                    <th class="w-10"></th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                <tr *ngFor="let cuenta of empresa.cuentasBancarias; let i = index">
                                    <td class="px-6 py-4 whitespace-nowrap">{{ cuenta.banco }}</td>
                                    <td class="px-6 py-4 whitespace-nowrap">{{ cuenta.numero }}</td>
                                    <td class="px-6 py-4"><button (click)="removeCuenta(i)" class="text-red-500 hover:text-red-700 text-sm">Eliminar</button></td>
                                </tr>
                                <tr>
                                    <td class="px-6 py-4"><input [(ngModel)]="newCuenta.banco" placeholder="Nombre del Banco" class="w-full border-gray-300 rounded-md"></td>
                                    <td class="px-6 py-4"><input [(ngModel)]="newCuenta.numero" placeholder="Número de Cuenta" class="w-full border-gray-300 rounded-md"></td>
                                    <td class="px-6 py-4"><button (click)="addCuenta()" class="px-4 py-2 bg-blue-500 text-white rounded-md">Añadir</button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Global Action Buttons -->
    <div class="flex justify-end space-x-4 mt-6">
        <button (click)="onCancel()" class="px-4 py-2 bg-gray-300 text-gray-800 rounded-md hover:bg-gray-400">Cancelar</button>
        <button (click)="onSave()" class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600">Guardar Cambios</button>
    </div>
</div>
