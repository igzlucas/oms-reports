<div class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">

  <!-- Encabezado y botón de acción -->
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-semibold text-gray-800">Gestión de Clientes</h1>
    <a [routerLink]="['/clients/new']" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-300 ease-in-out">
      + Añadir Nuevo Cliente
    </a>
  </div>

  <!-- Contenedor de la tabla -->
  <div class="bg-white shadow-md rounded-lg overflow-hidden">

    <!-- Usamos un ng-container para subscribirnos UNA SOLA VEZ al observable -->
    <ng-container *ngIf="clients$ | async as clients; else loading">

      <!-- Si hay clientes, mostramos la tabla. Si no, el template #noClients -->
      <table *ngIf="clients.length > 0; else noClients" class="min-w-full leading-normal">
        <thead>
          <tr class="border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
            <th class="px-5 py-3">Nombre</th>
            <th class="px-5 py-3">Email</th>
            <th class="px-5 py-3">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <!-- Iteramos sobre la variable 'clients' que ya contiene los datos -->
          <tr *ngFor="let client of clients" class="border-b border-gray-200 bg-white text-sm hover:bg-gray-50">
            <td class="px-5 py-5">
              <p class="text-gray-900 whitespace-no-wrap">{{ client.nombre }}</p>
            </td>
            <td class="px-5 py-5">
              <p class="text-gray-900 whitespace-no-wrap">{{ client.email }}</p>
            </td>
            <td class="px-5 py-5 whitespace-no-wrap">
              <a [routerLink]="['/clients', client.id, 'edit']" class="text-indigo-600 hover:text-indigo-900 mr-4 font-medium">Editar</a>
              <button (click)="deleteClient(client.id)" class="text-red-600 hover:text-red-900 font-medium">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Template para cuando no hay clientes -->
      <ng-template #noClients>
        <div class="p-6 text-center text-gray-500">
          No hay clientes registrados. ¡Añade el primero!
        </div>
      </ng-template>

    </ng-container>

    <!-- Template para cuando está cargando -->
    <ng-template #loading>
      <div class="p-6 text-center text-gray-500">
        Cargando clientes...
      </div>
    </ng-template>

  </div>
</div>

<app-confirmation-modal
  [isOpen]="isModalOpen"
  title="Confirmar Eliminación"
  message="¿Estás seguro de que deseas eliminar este cliente? Esta acción no se puede deshacer."
  (confirm)="onConfirmDelete()"
  (cancel)="onCancelDelete()"
></app-confirmation-modal>
