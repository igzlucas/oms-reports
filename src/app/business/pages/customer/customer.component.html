<div class="customer-page-container">
  <header class="page-header">
    <h1>Gestión de Clientes</h1>
    <button class="btn btn-primary" (click)="openModal(false)">+ Nuevo Cliente</button>
  </header>

  <div class="table-toolbar">
    <input type="text" class="form-control search-input" placeholder="Buscar por nombre o email..." [(ngModel)]="searchTerm" (ngModelChange)="filterCustomers()">
    <div class="actions">
        <button class="btn btn-danger" [disabled]="selectedCustomerIds.size === 0" (click)="deleteSelectedCustomers()">Eliminar Seleccionados</button>
    </div>
  </div>

  <div class="table-responsive-wrapper">
    <table class="data-table">
      <thead>
        <tr>
          <th class="w-12 border-b"><input type="checkbox" (change)="toggleSelectAll($any($event.target).checked)"></th>
          <th class="border-b">Nombre</th>
          <th class="border-b">Dirección</th>
          <th class="border-b">Email</th>
          <th class="border-b">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let customer of filteredCustomers">
          <td class="border-b"><input type="checkbox" [checked]="isCustomerSelected(customer.id)" (change)="toggleCustomerSelection(customer.id, $any($event.target).checked)"></td>
          <td class="border-b">{{ customer.nombre }}</td>
          <td class="border-b">{{ customer.direccion }}</td>
          <td class="border-b">{{ customer.email }}</td>
          <td class="border-b">
            <button class="btn-icon btn-edit" (click)="openModal(true, customer)">Editar</button>
            <button class="btn-icon btn-delete" (click)="deleteCustomer(customer.id)">Eliminar</button>
          </td>
        </tr>
        <tr *ngIf="filteredCustomers.length === 0">
            <td colspan="5" class="text-center p-4">No se encontraron clientes.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal para Crear/Editar Cliente -->
  <div *ngIf="isModalOpen" class="modal-backdrop">
    <div class="modal-content">
      <h2>{{ isEditMode ? 'Editar Cliente' : 'Nuevo Cliente' }}</h2>
      <form (ngSubmit)="saveCustomer()">
        <div class="form-group">
          <label>Nombre</label>
          <input type="text" class="form-control" [(ngModel)]="currentCustomer.nombre" name="nombre" required>
        </div>
        <div class="form-group">
          <label>Dirección</label>
          <input type="text" class="form-control" [(ngModel)]="currentCustomer.direccion" name="direccion">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-control" [(ngModel)]="currentCustomer.email" name="email">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
