<div class="p-4 bg-gray-100">
  <div *ngIf="isLoading" class="flex justify-center items-center h-64">
    <div class="loader ease-linear rounded-full border-8 border-t-8 border-gray-200 h-32 w-32"></div>
  </div>

  <div *ngIf="!isLoading" class="container mx-auto bg-white p-6 rounded-lg shadow-md">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold">Clientes</h1>
      <div class="relative">
        <button (click)="toggleDropdown()" class="bg-blue-500 text-white px-4 py-2 rounded-lg">Acciones</button>
        <div *ngIf="dropdownOpen" class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-xl z-10">
          <a (click)="openModalCreate($event)" class="block px-4 py-2 text-gray-800 hover:bg-gray-200">Crear Cliente</a>
        </div>
      </div>
    </div>

    <div class="flex justify-between items-center mb-4">
      <input type="text" [(ngModel)]="searchTerm" (input)="filterCustomers()" placeholder="Buscar clientes..." class="w-full p-2 border rounded-lg">
    </div>

    <div class="overflow-x-auto">
      <table *ngIf="!isLoading" class="min-w-full bg-white">
        <thead>
          <tr>
            <th class="py-2 px-4 border-b"><input type="checkbox" (change)="toggleSelectAll($event)"></th>
            <th class="py-2 px-4 border-b">Nombre</th>
            <th class="py-2 px-4 border-b">Dirección</th>
            <th class="py-2 px-4 border-b">Email</th>
            <th class="py-2 px-4 border-b">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let customer of filteredCustomers">
            <td class="py-2 px-4 border-b"><input type="checkbox" [checked]="customer.selected"></td>
            <td class="py-2 px-4 border-b">{{ customer.nombre }}</td>
            <td class="py-2 px-4 border-b">{{ customer.direccion }}</td>
            <td class="py-2 px-4 border-b">{{ customer.email }}</td>
            <td class="py-2 px-4 border-b">
              <button (click)="openModal(customer, $event)" class="text-blue-500 hover:underline">Editar</button>
              <button (click)="openModalDelete(customer, $event)" class="text-red-500 hover:underline ml-2">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div *ngIf="isModalOpen" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50">
    <div class="bg-white p-6 rounded-lg shadow-lg w-1/3">
      <h2 class="text-xl font-bold mb-4">Editar Cliente</h2>
      <form (ngSubmit)="saveCustomer()">
        <div class="mb-4">
          <label class="block text-gray-700">Nombre</label>
          <input type="text" [(ngModel)]="newCustomer.nombre" name="nombre" class="w-full p-2 border rounded-lg">
        </div>
        <div class="mb-4">
          <label class="block text-gray-700">Dirección</label>
          <input type="text" [(ngModel)]="newCustomer.direccion" name="direccion" class="w-full p-2 border rounded-lg">
        </div>
        <div class="mb-4">
          <label class="block text-gray-700">Email</label>
          <input type="email" [(ngModel)]="newCustomer.email" name="email" class="w-full p-2 border rounded-lg">
        </div>
        <div class="flex justify-end">
          <button type="button" (click)="closeModal()" class="bg-gray-300 text-gray-800 px-4 py-2 rounded-lg mr-2">Cancelar</button>
          <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-lg">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div *ngIf="isModalOpenCreate" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50">
    <div class="bg-white p-6 rounded-lg shadow-lg w-1/3">
      <h2 class="text-xl font-bold mb-4">Crear Cliente</h2>
      <form (ngSubmit)="saveCustomer()">
        <div class="mb-4">
          <label class="block text-gray-700">Nombre</label>
          <input type="text" [(ngModel)]="newCustomer.nombre" name="nombre" class="w-full p-2 border rounded-lg">
        </div>
        <div class="mb-4">
          <label class="block text-gray-700">Dirección</label>
          <input type="text" [(ngModel)]="newCustomer.direccion" name="direccion" class="w-full p-2 border rounded-lg">
        </div>
        <div class="mb-4">
          <label class="block text-gray-700">Email</label>
          <input type="email" [(ngModel)]="newCustomer.email" name="email" class="w-full p-2 border rounded-lg">
        </div>
        <div class="flex justify-end">
          <button type="button" (click)="closeModalCreate()" class="bg-gray-300 text-gray-800 px-4 py-2 rounded-lg mr-2">Cancelar</button>
          <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-lg">Crear</button>
        </div>
      </form>
    </div>
  </div>

  <div *ngIf="isModalOpenDelete" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50">
    <div class="bg-white p-6 rounded-lg shadow-lg w-1/3">
      <h2 class="text-xl font-bold mb-4">Eliminar Cliente</h2>
      <p>¿Estás seguro de que quieres eliminar este cliente?</p>
      <div class="flex justify-end mt-4">
        <button type="button" (click)="closeModalDelete()" class="bg-gray-300 text-gray-800 px-4 py-2 rounded-lg mr-2">Cancelar</button>
        <button type="button" (click)="deleteCustomer(currentCustomerId)" class="bg-red-500 text-white px-4 py-2 rounded-lg">Eliminar</button>
      </div>
    </div>
  </div>

  <app-alert
  [isVisible]="alertVisible"
  [message]="alertMessage"
  [type]="alertType"
></app-alert>
</div>
