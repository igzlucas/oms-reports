<div class="reportes-table-container">
  <div class="table-header">
    <h2>Mis Reportes</h2>
    <a routerLink="/reports/new" class="btn btn-primary">Crear Nuevo Reporte</a>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Cliente</th>
        <th>Fecha</th>
        <th>Estado</th>
        <th>Monto Total</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let report of reports">
        <td>{{ report.reporteId }}</td>
        <td>{{ report.clientId }}</td> <!-- Considerar mostrar nombre de cliente -->
        <td>{{ getFormattedDate(report.fecha) }}</td>
        <td>
          <span class="status-badge" [ngClass]="report.status">{{ report.status }}</span>
        </td>
        <td>{{ report.montoTotal | number:'1.2-2' }} {{ report.moneda }}</td>
        <td>
          <a [routerLink]="['/reports/edit', report.id]" class="btn btn-sm btn-info">Editar</a>
          <a [routerLink]="['/reports', report.id]" class="btn btn-sm btn-success">Ver</a>
          <div *ngIf="report.status === 'completado'" class="share-section">
            <input type="text" [value]="getShareableLink(report)" #shareLink readonly>
            <button (click)="copyToClipboard(shareLink)">Copiar</button>
            <button (click)="shareReport(report)">Compartir</button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
