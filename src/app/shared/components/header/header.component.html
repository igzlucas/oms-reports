<header class="sticky top-0 z-10 bg-white shadow-md">
  <div class="flex items-center justify-between h-16 px-4 mx-auto max-w-7xl sm:px-6 lg:px-8">
    
    <!-- Botón de Hamburguesa y Título -->
    <div class="flex items-center">
      <!-- Botón de menú que solo aparece en pantallas pequeñas (hasta lg) -->
      <button (click)="toggleSidebar()" class="p-2 text-gray-500 rounded-md lg:hidden hover:text-gray-700 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500">
        <i class="fas fa-bars text-xl"></i>
      </button>
      <h1 class="hidden ml-4 text-xl font-semibold text-gray-800 lg:block">Dashboard</h1>
    </div>

    <!-- Acciones del lado derecho -->
    <div class="flex items-center space-x-4">
      
      <!-- Botón de Configuración -->
      <button (click)="redirectToProfile()" class="p-2 text-gray-500 rounded-full hover:bg-gray-100 hover:text-gray-700 focus:outline-none">
        <i class="fas fa-cog text-lg"></i>
      </button>

      <!-- Menú Desplegable de Usuario -->
      <div class="relative" (clickOutside)="closeDropdown()">
        <button (click)="toggleDropdown()" class="flex items-center space-x-2 focus:outline-none">
          <ng-container *ngIf="user$ | async as user">
            <!-- Wrapper for avatar and name -->
            <div class="flex flex-col items-center md:flex-row md:space-x-2">
              <img [src]="user.photoURL || 'assets/default-avatar.png'" alt="Avatar" class="w-8 h-8 rounded-full object-cover">
              <!-- Mobile: name below avatar -->
              <span class="text-xs font-medium text-gray-700 mt-1 md:hidden">{{ user.displayName || user.email }}</span>
              <!-- Desktop: name beside avatar -->
              <span class="hidden text-sm font-medium text-gray-700 md:inline">{{ user.displayName || user.email }}</span>
            </div>
          </ng-container>
          <i class="fas fa-chevron-down text-xs text-gray-500"></i>
        </button>

        <!-- Panel del Dropdown -->
        <div *ngIf="isDropdownOpen" class="absolute right-0 w-48 mt-2 py-2 bg-white rounded-md shadow-lg ring-1 ring-black ring-opacity-5">
          <a (click)="redirectToProfile()" class="block px-4 py-2 text-sm text-gray-700 cursor-pointer hover:bg-gray-100">
            <i class="fas fa-user fa-fw mr-2"></i>Perfil
          </a>
          <a (click)="logout()" class="block px-4 py-2 text-sm text-gray-700 cursor-pointer hover:bg-gray-100">
            <i class="fas fa-sign-out-alt fa-fw mr-2"></i>Cerrar sesión
          </a>
        </div>
      </div>

    </div>
  </div>
</header>
